name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build 2>&1 | tee build.log
        working-directory: ${{ github.workspace }}

      - name: Test
        run: swift test 2>&1 | tee test.log
        working-directory: ${{ github.workspace }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: |
            build.log
            test.log
